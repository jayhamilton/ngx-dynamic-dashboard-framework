<mat-drawer-container class="example-container" autosize>
  <mat-drawer
    #drawer
    class="example-sidenav"
    [class.collapsed]="!navExpanded"
    mode="side"
    [opened]="true"
    (transitionend)="onNavRailTransitionEnd($event)">
    <mat-nav-list>
      @for (board of boardData; track board) {
        <mat-list-item
          [class.active]="board.id === selectedBoardId"
          [matTooltip]="board.title"
          [matTooltipDisabled]="navExpanded"
          matTooltipPosition="right"
          (click)="selectBoard(board.id)">
          <mat-icon matListItemIcon>{{ board.icon || 'dashboard' }}</mat-icon>
          @if (navExpanded) {
            {{ board.title }}
          }
        </mat-list-item>
      }
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer #layout class="layout-drawer" mode="side" position="end" (openedChange)="onPushDrawerAnimationDone()">
    <app-sidelayout></app-sidelayout>
  </mat-drawer>

  <mat-drawer-container class="config-panel-container">
    <mat-drawer #configPanel mode="over" position="end" (closed)="onConfigPanelClosed()">
      <app-config-panel></app-config-panel>
    </mat-drawer>

    <mat-drawer-container class="library-panel-container">
      <mat-drawer #library mode="over" position="end">
        <app-library></app-library>
      </mat-drawer>

      <mat-drawer-container class="help-panel-container">
        <mat-drawer #helpPanel mode="over" position="end">
          <app-help-panel></app-help-panel>
        </mat-drawer>

        <div class="example-sidenav-content">
          <app-board></app-board>
        </div>
      </mat-drawer-container>
    </mat-drawer-container>
  </mat-drawer-container>
</mat-drawer-container>
