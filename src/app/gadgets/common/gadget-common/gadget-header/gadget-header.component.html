<mat-card-header class="move-cursor">
  <mat-icon mat-card-avatar class="gadget-icon">{{ displayIcon }}</mat-icon>
  <mat-card-title>{{ title }}</mat-card-title>
  <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
  <!--<mat-card-subtitle>{{description}}</mat-card-subtitle>-->
    <button
      mat-icon-button
      class="help-button"
      matTooltip="Help"
      aria-label="Help"
      (click)="openHelp()"
      >
      <mat-icon>help_outline</mat-icon>
    </button>
    <button
      mat-icon-button
      class="more-button"
      [matMenuTriggerFor]="menu"
      aria-label="Toggle menu"
      >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" xPosition="before">
      @if (!locked) {
        <button mat-menu-item (click)="toggleConfigMode()">{{ menuLabel }}</button>
      }
      <button mat-menu-item (click)="remove()">Remove</button>
    </mat-menu>
  </mat-card-header>
@if (inConfig) {
  <div class="config-mode-indicator">Configuration Mode</div>
}
