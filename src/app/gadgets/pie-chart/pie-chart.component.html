<mat-card appearance="outlined" [cdkDragDisabled]="inConfig" cdkDrag>
  <app-gadget-header
    [title]="title"
    [subtitle]="subtitle"
    [iconpath]="icon"
    (removeEvent)="remove()"
    [inConfig]="inConfig"
    (toggleConfigModeEvent)="toggleConfigMode()">
  </app-gadget-header>

  @if (!inConfig) {
    <mat-card-content class="chart-content">
      <ngx-charts-pie-chart
        [scheme]="colorScheme"
        [results]="chartData"
        [legend]="chartLegend"
        [legendTitle]="chartLegendTitle"
        [gradient]="chartGradient"
        [labels]="chartShowLabels"
        [doughnut]="chartDoughnut"
        [explodeSlices]="chartExplodeSlices">
      </ngx-charts-pie-chart>
    </mat-card-content>
  }

  @if (inConfig) {
    <mat-card-content>
      <app-dynamic-form
        [gadgetTags]="tags"
        [propertyPages]="propertyPages"
        [instanceId]="instanceId"
        [tabIndex]="0"
        (updatePropertiesEvent)="propertyChangeEvent($event)">
      </app-dynamic-form>
    </mat-card-content>
  }
</mat-card>
