<mat-card appearance="outlined" [cdkDragDisabled]="inConfig" cdkDrag>
  <app-gadget-header
    [title]="title"
    [subtitle]="subtitle"
    [iconpath]="icon" (removeEvent)="remove()"
    [inConfig]="inConfig" (toggleConfigModeEvent)="toggleConfigMode()">
  </app-gadget-header>

  @if (!inConfig) {
    <mat-card-content>
      <mat-form-field appearance="fill">
        <mat-label>Line Lead(s)</mat-label>
        <mat-chip-listbox>
          @for (user of getUsersByRole('lead'); track user) {
            <mat-chip-option color="warn" selected>{{user.username}}</mat-chip-option>
          }
        </mat-chip-listbox>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Drivers</mat-label>
        <mat-chip-listbox>
          @for (user of getUsersByRole('driver'); track user) {
            <mat-chip-option color="warn" selected>{{user.username}}</mat-chip-option>
          }
        </mat-chip-listbox>
      </mat-form-field>
    </mat-card-content>
  }

  @if (inConfig) {
    <mat-card-content>
      <app-dynamic-form
        [gadgetTags]="tags"
        [propertyPages]="propertyPages"
        [instanceId]="instanceId"
        [tabIndex]="isMissingPropertyValue() ? 1 : 0" (updatePropertiesEvent)="propertyChangeEvent($event)">
      </app-dynamic-form>
    </mat-card-content>
  }
</mat-card>
