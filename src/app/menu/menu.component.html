<mat-toolbar color="primary">
  <span *checkPermissions>
    @if (boardExists) {
      <button mat-icon-button class="example-icon" matTooltip="Open board menu" aria-label="Open board menu" (click)="toggleMenu()">
        <mat-icon>menu</mat-icon>
      </button>
    }
  </span>

  <span class="app-title">{{ appConfigService.appTitle$ | async }}</span>
  <span class="example-spacer"></span>

  @if (!(locked$ | async)) {
    <span *checkPermissions>
      <button mat-icon-button (click)="openConfigDialog()" class="example-icon"
        matTooltip="Board settings" aria-label="Board settings">
        <mat-icon>settings</mat-icon>
      </button>
    </span>
  }

  <!-- matTooltip sits on the wrapping span, not the button: a disabled
       button doesn't reliably fire the mouseenter MatTooltip listens for,
       so the tooltip would silently never show if bound to the button itself. -->
  @if (!(locked$ | async)) {
    <span *checkPermissions [matTooltip]="boardExists ? 'Gadget library' : 'Create a board first'">
      <button mat-icon-button (click)="toggleLibraryPanel()" [disabled]="!boardExists"
        aria-label="Gadget library">
        <mat-icon>playlist_add</mat-icon>
      </button>
    </span>
  }

  @if (!(locked$ | async)) {
    <span *checkPermissions [matTooltip]="boardExists ? 'Board layout' : 'Create a board first'">
      <button mat-icon-button (click)="toggleLayout()" class="example-icon favorite-icon" [disabled]="!boardExists"
        aria-label="Board layout">
        <mat-icon>dashboard</mat-icon>
      </button>
    </span>
  }

  <span *checkPermissions [matTooltip]="boardExists ? ((locked$ | async) ? 'Unlock board' : 'Lock board') : 'Create a board first'">
    <button mat-icon-button (click)="toggleLocked()" class="example-icon" [disabled]="!boardExists"
      [attr.aria-label]="(locked$ | async) ? 'Unlock board' : 'Lock board'">
      <mat-icon>{{ (locked$ | async) ? 'lock' : 'lock_open' }}</mat-icon>
    </button>
  </span>

  <span *checkPermissions [matTooltip]="agentPanelOpen ? 'Close assistant' : 'Open assistant'">
    <button mat-icon-button (click)="toggleAgentPanel()" class="example-icon" [attr.aria-label]="agentPanelOpen ? 'Close assistant' : 'Open assistant'">
      <mat-icon>auto_awesome</mat-icon>
    </button>
  </span>

  <span *checkPermissions [matTooltip]="(themeService.isDark$ | async) ? 'Switch to light mode' : 'Switch to dark mode'">
    <button mat-icon-button (click)="toggleTheme()" class="example-icon" [attr.aria-label]="(themeService.isDark$ | async) ? 'Switch to light mode' : 'Switch to dark mode'">
      <mat-icon>{{ (themeService.isDark$ | async) ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </span>

  <span style="margin-left: 20px;" matTooltip="Log out">
    <button mat-icon-button (click)="logout()" class="example-icon favorite-icon"
      aria-label="Log out">
      <mat-icon>logout</mat-icon>
    </button>
  </span>


  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
</mat-toolbar>
