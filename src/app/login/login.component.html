<div class="login-page">
  <mat-card appearance="outlined" class="login-card">
    <div class="login-brand">
      <mat-icon>space_dashboard</mat-icon>
    </div>

    <mat-card-title>NGX Dynamic Dashboard</mat-card-title>
    <p class="login-subtitle">Sign in to continue</p>

    <mat-card-content>
      <form [formGroup]="form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput required formControlName="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input type="password" matInput required formControlName="password" />
        </mat-form-field>

        @if (showMessage) {
          <div class="login-error">
            <mat-icon>error_outline</mat-icon>
            <span>Username or password is incorrect.</span>
          </div>
        }

        <div class="login-actions">
          <button type="submit" color="primary" (click)="authenticate()" mat-flat-button>
            Login
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
